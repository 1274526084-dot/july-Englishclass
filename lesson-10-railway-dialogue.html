<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172638">
  <meta name="july-release" content="lesson10-spring-volunteer-v5">
  <title>Spring Festival Rail Shift · Lesson 10</title>
  <link rel="stylesheet" href="railway-games/v5/app.css">
  <script src="railway-games/v5/app.js?v=2" defer></script>
</head>
<body>
  <header class="station-bar">
    <span class="brand" lang="en">RAIL SHIFT <small>LESSON 10</small></span>
    <button class="sound" id="sound" type="button" hidden aria-pressed="false">♫ Music on</button>
  </header>
  <main>
    <section id="hub" class="hub">
      <h1 lang="en">Spring Festival Rail Shift</h1>
      <p>选择老师当前布置的游戏。</p>
      <nav aria-label="第十课游戏" class="hub-links">
        <a href="?mission=1"><span>01</span><strong lang="en">Welcome Desk</strong><small>看图接话 · 10题</small></a>
        <a href="?mission=2"><span>02</span><strong lang="en">Lost &amp; Found</strong><small>听短对话选图 · 3题</small></a>
        <a href="?mission=3"><span>03</span><strong lang="en">Last Call</strong><small>听一段对话，同页完成两题</small></a>
      </nav>
    </section>

    <section id="intro" class="intro" hidden>
      <div class="intro-copy">
        <p class="kicker" id="mission-number" lang="en"></p>
        <h1 id="mission-title" lang="en"></h1>
        <p id="mission-intro" lang="en"></p>
        <p id="mission-guide" class="muted"></p>
        <p id="identity" class="identity" aria-live="polite"></p>
        <form id="signin" hidden>
          <label>班级<select id="class-name" required><option value="">选择自己的班级</option></select></label>
          <label>姓名<input id="student-name" maxlength="30" autocomplete="name" required placeholder="填写自己的姓名"></label>
          <p class="note">第十课成绩会记入学习记录，请使用本人姓名和班级。</p>
          <button id="sign-in" class="primary" type="submit">确认身份，开始游戏</button>
        </form>
        <div class="actions">
          <button type="button" id="start" class="primary" hidden lang="en">Start Mission</button>
          <button type="button" id="change-student" class="quiet" hidden>更换学生</button>
          <button type="button" id="retry-load" class="quiet" hidden>重试加载</button>
        </div>
        <p id="intro-status" role="status" class="note"></p>
      </div>
      <img id="cover-image" class="cover" alt="" width="960" height="640" hidden>
    </section>

    <section id="game" hidden>
      <div class="task-bar">
        <div><strong id="game-title" lang="en"></strong><p id="progress" class="note"></p></div>
        <button type="button" id="pa" class="listen">♫ 车站播报</button>
      </div>
      <div class="layout">
        <aside class="scene" aria-label="车站场景">
          <img id="scene-image" width="960" height="640" alt="" decoding="async">
          <div class="scene-copy">
            <p id="scene-name" class="kicker"></p>
            <p id="scene-line"></p>
            <button type="button" class="listen" id="hear-scene">▶ 听题</button>
            <p id="voice-status" role="status" class="note"></p>
          </div>
        </aside>
        <div class="work">
          <div id="questions" class="questions"></div>
          <div class="actions navigation">
            <button type="button" class="quiet" id="previous">← 上一题</button>
            <button type="button" class="quiet" id="next">下一题 →</button>
            <button type="button" class="primary" id="submit" hidden>交卷并记分</button>
          </div>
        </div>
      </div>
    </section>

    <section id="report" class="report" hidden>
      <p class="kicker" lang="en">MISSION REPORT</p>
      <h1 id="report-title" lang="en"></h1>
      <strong id="score" class="score"></strong>
      <p id="receipt" role="status"></p>
      <div class="actions">
        <button id="retry-save" type="button" class="primary" hidden>重试同步</button>
        <button id="reauth" type="button" class="quiet" hidden>在本页重新确认身份</button>
        <button id="play-again" type="button" class="quiet" hidden>再练一遍</button>
      </div>
      <details id="review" class="review"><summary>复盘本关对话</summary><div id="review-list"></div></details>
    </section>
  </main>
  <audio id="voice" preload="none"></audio>
  <audio id="music" preload="none" loop></audio>
</body>
</html>
