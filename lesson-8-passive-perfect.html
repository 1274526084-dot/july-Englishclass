<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="july-release" content="lesson8-passive-v1"><meta name="theme-color" content="#234c37"><title>第8课 · 现在完成时被动语态 | July English Lab</title><link rel="stylesheet" href="lesson8-passive.css"></head><body><div id="app"></div><script>window.LESSON8={"group":"perfect","index":4,"bank":[{"id":"present","title":"一般现在时","english":"Present Simple","formula":"am / is / are + 过去分词","focus":"先判断主语是单数还是复数，再选择 be 的形式。","questions":[{"active":"Staff clean the waiting room every morning.","target":"The waiting room ____ by staff every morning."},{"active":"People use these machines to check tickets.","target":"These machines ____ to check tickets."},{"target":"All safety rules ____ by students during every training class.","verb":"follow"},{"target":"This train ____ by a trained driver every day.","verb":"drive"}]},{"id":"past","title":"一般过去时","english":"Past Simple","formula":"was / were + 过去分词","focus":"注意过去时间标志，以及主语与 was / were 的一致。","questions":[{"active":"Workers repaired the signal system yesterday.","target":"The signal system ____ by workers yesterday."},{"active":"The teacher gave us two safety instructions last Monday.","target":"We ____ two safety instructions by the teacher last Monday."},{"target":"The old batteries ____ last week.","verb":"replace"},{"target":"A mistake ____ in the report yesterday.","verb":"find"}]},{"id":"future","title":"一般将来时","english":"Future Simple","formula":"will be + 过去分词","focus":"本组统一使用 will 结构；will 后的 be 使用原形。","questions":[{"active":"The college will open a new training center next year.","target":"A new training center ____ by the college next year."},{"active":"The students will finish the project next Friday.","target":"The project ____ by the students next Friday."},{"target":"The visitors ____ around the railway museum tomorrow.","verb":"show"},{"target":"The new batteries ____ next month.","verb":"install"}]},{"id":"continuous","title":"现在进行时","english":"Present Continuous","formula":"am / is / are being + 过去分词","focus":"正在发生且主语承受动作时，being 不能省略。","questions":[{"active":"Workers are checking the doors now.","target":"The doors ____ by workers now."},{"active":"A technician is repairing the air conditioner at the moment.","target":"The air conditioner ____ by a technician at the moment."},{"target":"Listen! An important announcement ____ at the station.","verb":"make"},{"target":"Look! The old computers ____ into another room.","verb":"move"}]},{"id":"perfect","title":"现在完成时","english":"Present Perfect","formula":"has / have been + 过去分词","focus":"注意 has / have 与主语一致，且 been 不能省略。","questions":[{"active":"The engineers have tested the new signal system.","target":"The new signal system ____ by the engineers."},{"active":"The teacher has sent the students two messages.","target":"Two messages ____ to the students by the teacher."},{"target":"The train ____ already.","verb":"clean"},{"target":"All the safety problems ____ so far.","verb":"solve"}]}],"classes":["26-储能技术01班","26-新能源汽车32班","26-新能源汽车33班","26-人工智能15班","26-人工智能16班","26-无人机1班","26-无人机2班","26-测量04班","26-铁工84班","26-铁工85班","26-机车122班","26-机车123班","26-机车124班","26-机车125班","26-车辆68班","26-车辆69班","26-城轨车辆58班","26-城轨信号53班","26-城轨信号54班","26-运营116班","26-城轨运营68班","26-城轨运营69班","26-酒店6班","26-智控08班","26-电气68班","26-电气69班","26-机电37班","26-机电38班","默认班级（测试）"]};</script><script src="lesson8-passive.js"></script></body></html>
