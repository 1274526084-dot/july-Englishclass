.studio[data-state="thinking"] .partner-avatar .avatar-eyes { transform: translateY(-2px); animation: none; }
.studio[data-state="listening"] .avatar-status { background: #bc7650; animation: listening 1.3s infinite; }
.listening-wave { display: none; gap: 3px; align-items: center; height: 19px; }
.listening-wave i { width: 3px; height: 9px; background: currentColor; border-radius: 2px; animation: mouth .5s infinite alternate; }
.listening-wave i:nth-child(2) { height: 17px; animation-delay: .15s; }
.listening-wave i:nth-child(3) { height: 13px; animation-delay: .3s; }
.mic.capturing .listening-wave { display: flex; }
.message-enter { animation: message-in .25s ease-out both; }
@keyframes typing { 0%, 65%, 100% { transform: translateY(0); opacity: .5; } 32% { transform: translateY(-3px); opacity: 1; } }
@keyframes blink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(.1); } }
@keyframes mouth { from { transform: scaleY(.45); } to { transform: scaleY(1); } }
@keyframes nod { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(3deg); } }
@keyframes listening { 50% { box-shadow: 0 0 0 4px #bc765025; } }
@keyframes message-in { from { opacity: .3; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }

/* Unit 3 practice feedback. This engine works without a model account. */
(function (root) {

      .replace(/\bi've\b/g, 'i have').replace(/\bi'm\b/g, 'i am')

      checks,

        if(error.name==='NotAllowedError')error=new Error('麦克风权限未允许，请在地址栏的网站权限中开启麦克风。');
        else if(error.name==='NotFoundError')error=new Error('没有找到麦克风，请连接或选择可用的麦克风。');
        finish(error);
      }
    })();
    return {stop,cancel};
  }
  const api={start,PCMStream,asrError};
  if(typeof module==='object'&&module.exports)module.exports=api;else root.Unit3Realtime=api;
})(typeof window==='object'?window:globalThis);

</script>
<script>
(function () {
  'use strict';

  const scenes = window.MINI_TALK_SCENES;
  const { gradeReading, gradeDialogue } = window.MiniTalkEngine;
  const sceneGrid = document.getElementById('scene-grid');
  const home = document.getElementById('practice-home');
  const practice = document.getElementById('practice');
  const sessions = new Map();
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const cloudOrigin = ['http://localhost:4173', 'http://localhost:5173', 'https://1274526084-dot.github.io'].includes(location.origin);
  const cloudApi = 'https://cloudbase-d3gxxe4l88c3d5907-1431364187.ap-shanghai.app.tcloudbase.com/speakingLabApi';
  let scene = scenes[0];
  let mode = null;
  let session = null;
  let epoch = 0;
  let capture = null;
  let recording = null;
  let recordingUrl = '';
  let cloudRequest = null;
  let captureError = '';
  let replyTimer = null;
  let replying = false;
  let voiceSpeaking = false;
  let voiceId = 0;
  const partner = 'Alex';
  const microphone = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-3 0h6"/></svg>';

  function escape(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]
    ));
  }

  function action(label, name, primary = false, disabled = false) {
    return '<button type="button" class="button ' + (primary ? 'primary' : 'secondary') +
      '" data-action="' + name + '"' + (disabled ? ' disabled' : '') + '>' + escape(label) + '</button>';
  }

  function listLength() {
    return mode === 'read' ? scene.lines.length : scene.rounds.length;
  }

  function scrollPractice() {
    practice.scrollIntoView({ block: 'start' });
    practice.querySelector('h2')?.focus({ preventScroll: true });
  }

  function stopVoice() {
    voiceId++;
    voiceSpeaking = false;
    window.speechSynthesis?.cancel();
    practice.querySelectorAll('audio').forEach(audio => audio.pause());
    syncPartnerState();
  }

  function disposeRecording() {
    if (recordingUrl) URL.revokeObjectURL(recordingUrl);
    recording = null;
    recordingUrl = '';
  }

  function resetAudio() {
    epoch++;
    clearTimeout(replyTimer);
    replyTimer = null;
    replying = false;
    stopVoice();
    cloudRequest?.abort();
    cloudRequest = null;
    const current = capture;
    capture = null;
    if (current) {
      current.live?.cancel();
      clearTimeout(current.timer);
      if (current.recognizer) current.recognizer.abort();
      if (current.recorder?.state === 'recording') current.recorder.stop();
      current.stream?.getTracks().forEach(track => track.stop());
    }
    disposeRecording();
    captureError = '';
  }

  function speak(text, rate = 0.89) {
    if (capture) {
      announce('请先结束录音，再播放英文。');
      return;
    }
    if (!window.speechSynthesis || !window.SpeechSynthesisUtterance) {
      announce('浏览器没有提供英文朗读。可以播放左侧课件原声。', true);
      return;
    }
    stopVoice();
    const currentVoice = voiceId;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = rate;
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(item => item.lang === 'en-US' && item.localService)
      || voices.find(item => item.lang.toLowerCase().startsWith('en'));
    if (voice) utterance.voice = voice;
    utterance.onstart = () => {
      if (currentVoice !== voiceId) return;
      voiceSpeaking = true;
      syncPartnerState();
    };
    utterance.onend = () => {
      if (currentVoice !== voiceId) return;
      voiceSpeaking = false;
      syncPartnerState();
    };
    utterance.onerror = event => {
      if (currentVoice !== voiceId) return;
      voiceSpeaking = false;
      syncPartnerState();
      if (!['canceled', 'interrupted'].includes(event.error)) announce('英文朗读暂不可用，可以听课件原声。', true);
    };
    speechSynthesis.speak(utterance);
  }

  function renderScenes() {
    sceneGrid.innerHTML = scenes.map((item, i) => `
      <button type="button" class="scene" data-scene="${item.id}" aria-pressed="${item.id === scene.id}">
        <span class="scene-art ${item.color}"><span class="scene-num">0${i + 1}</span><img src="${item.icon}" alt=""></span>
        <span class="scene-copy"><small lang="en">${escape(item.english)}</small><strong>${escape(item.title)}</strong><span class="scene-selected">${item.id === scene.id ? '✓ 已选择' : '选择这个情境'}</span></span>
      </button>`).join('');
    document.getElementById('selected-scene').textContent = '已选 · ' + scene.english;
    window.Unit3Archive?.refresh();
  }

  function openRoute(route) {
    if (window.Unit3Archive && !window.Unit3Archive.start()) return;
    resetAudio();
    mode = route;
    const key = scene.id + '/' + route;
    if (!sessions.has(key)) sessions.set(key, { index: 0, results: [], draft: '', source: 'typed' });
    session = sessions.get(key);
    home.hidden = true;
    renderPractice();
    scrollPractice();
    if (session.index < listLength()) speak(route === 'talk' ? scene.rounds[session.index].prompt : scene.lines[session.index][1]);
  }

  function showHome() {
    if (!mode) return;
    resetAudio();
    mode = null;
    practice.hidden = true;
    practice.replaceChildren();
    home.hidden = false;
    renderScenes();
    document.getElementById('scenes').scrollIntoView({ block: 'start' });
  }

  function portrait() {
    return '<span class="portrait" aria-hidden="true"><svg viewBox="0 0 80 80"><rect width="80" height="80" rx="40" fill="#e2ede6"/><g class="avatar-person"><path d="M10 84c3-19 16-25 30-25s27 6 30 25" fill="#386d5b"/><path d="m30 61 10 10 10-10" fill="#faf4d9"/><path d="M34 51h12v12l-6 6-6-6z" fill="#d99b7f"/><ellipse cx="40" cy="34" rx="20" ry="24" fill="#f5c8a7"/><path d="M20 35C13 20 22 7 34 6c18-4 29 7 27 28l-5-12c-7 2-17 1-24-3-2 7-6 11-12 16" fill="#463e35"/><g class="avatar-eyes"><circle cx="32" cy="35" r="1.7" fill="#3d3a35"/><circle cx="48" cy="35" r="1.7" fill="#3d3a35"/></g><path d="m28 29 7-1m10 0 7 1" fill="none" stroke="#635145" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="27" cy="42" rx="4" ry="2" fill="#e8a38e" opacity=".5"/><ellipse cx="53" cy="42" rx="4" ry="2" fill="#e8a38e" opacity=".5"/><path d="M34 46q6 6 12 0" class="avatar-smile" fill="none" stroke="#9a5945" stroke-width="2" stroke-linecap="round"/><ellipse class="avatar-mouth" cx="40" cy="48" rx="5" ry="4" fill="#9a5945"/></g></svg></span>';
  }

  function syncPartnerState() {
    const state = replying ? 'thinking' : capture ? (capture.stopping ? 'finishing' : capture.active ? 'listening' : 'connecting') : voiceSpeaking ? 'speaking' : 'ready';
    const labels = { thinking: 'Alex 正在回应', listening: '我在听你说', connecting: '正在连接麦克风与识别', finishing: '正在接收最后的识别文字', speaking: 'Alex 正在说', ready: session?.index === listLength() ? '这次聊得不错！' : '轮到你来回答' };
    const studio = practice.querySelector('.studio');
    if (studio) studio.dataset.state = state;
    const status = document.getElementById('partner-status');
    if (status) status.textContent = labels[state];
  }

  function renderAside() {
    const transcript = scene.lines.map(([role, en, zh]) =>
      '<li><strong>' + role + '</strong> <span lang="en">' + escape(en) + '</span><br>' + escape(zh) + '</li>'
    ).join('');
    const vocab = scene.words.map(([en, zh]) =>
      '<div><dt lang="en">' + escape(en) + '</dt><dd>' + escape(zh) + '</dd></div>'
    ).join('');
    return `<details class="resource-drawer"><summary>课件原声与词语 <span>需要时再看</span></summary><div class="aside">
      <h3>${escape(scene.sourceTitle)}</h3>
      <audio controls preload="none" aria-label="本情境课件原声" src="${scene.audio}"></audio>
      <details><summary>查看原文和中文</summary><ol class="transcript-list">${transcript}</ol></details>
      <dl class="vocab">${vocab}</dl>
    </div></details>`;
  }

  function scoreContent(open = false) {
    const count = session.results.length;
    const complete = session.index === listLength();
    const index = session.reviewIndex ?? count - 1;
    const result = session.results[index];
    const unit = mode === 'read' ? '句' : '轮';
    const average = count ? Math.round(session.results.reduce((sum, item) => sum + item.score, 0) / count) : null;
    const score = complete ? average : result?.score;
    const bars = result?.breakdown?.map(([label, value, total]) =>
      `<div class="score-row"><span>${label}</span><b>${value}/${total}</b><progress value="${value}" max="${total}" aria-label="${label}"></progress></div>`
    ).join('') || '';
    const words = result?.words?.map(item => item.matched ? escape(item.word)
      : '<mark class="missed">' + escape(item.word) + '</mark>').join(' ');
    const rounds = session.results.map((item, i) =>
      `<button class="round-score" type="button" data-action="review" data-round="${i}" aria-pressed="${i === index}">第${i + 1}${unit}<b>${item.score}</b></button>`
    ).join('');
    return `<div class="score-heading"><h3>练习评分</h3><span>${count} / ${listLength()} ${unit}</span></div>
      <div class="score-value"><strong>${score ?? '–'}</strong><span>/ 100</span></div>
      <p class="small">${complete ? '本次平均参考分' : result ? '第' + (index + 1) + unit + '参考分' : '作答后显示参考分'}</p>
      <progress class="overall-progress" value="${count}" max="${listLength()}" aria-label="完成进度"></progress>
      ${rounds ? '<div class="round-scores">' + rounds + '</div>' : ''}
      ${result ? `<details class="score-detail"${open ? ' open' : ''}><summary>查看第${index + 1}${unit}反馈</summary>
        <p class="small">${escape(result.sourceLabel)}</p>${bars}
        ${words ? '<p class="word-match" lang="en">' + words + '</p>' : ''}
        <p class="score-advice">${escape(result.advice)}</p>
        ${mode === 'talk' ? '<p class="small">一种说法</p><p class="example-line" lang="en">' + escape(scene.rounds[index].example) + '</p>' : action('听反馈', 'reply')}
      </details>` : ''}`;
  }

  function renderComposer() {
    const isRead = mode === 'read';
    const result = session.results[session.index];
    const round = scene.rounds[session.index];
    return `<div class="composer">
      <div class="your-turn"><span>${isRead ? '现在跟读' : '轮到你'}</span><p>${isRead ? '听范读，再用英语读出上面这句。' : escape(round.goal)}</p></div>
      <details class="hint"><summary>${isRead ? '需要示例？' : '给我一点提示'}</summary>
        ${isRead ? '' : '<p lang="en">' + escape(round.frame) + '</p>'}
        ${action('填入示例，体验回应', 'example')}
      </details>
      <label class="sr-only" for="answer">${isRead ? '我的跟读文字' : '我的英文回答'}</label>
      <textarea id="answer" lang="en" rows="2" maxlength="500" placeholder="${cloudOrigin ? '点“开始说话”，英文会实时显示…' : '点麦克风说，或在这里输入英文…'}">${escape(session.draft)}</textarea>
      <div class="composer-buttons">
        <button type="button" class="button mic" data-action="speak">${microphone}<span class="mic-label">开始说话</span><span class="listening-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span></button>
        <div class="composer-send">${action(isRead ? (result ? '重新评分' : '看看得分') : '发送 →', 'grade', true, !session.draft.trim())}
          ${isRead && result ? action(session.index + 1 === listLength() ? '完成跟读' : '下一句', 'next') : ''}</div>
      </div>
      ${Recognition ? '<details class="voice-tools"><summary>只录音回听</summary>' + action('开始录音', 'record') + '</details>' : ''}
      <div class="recording" id="recording-panel" hidden></div>
      <p class="status" id="voice-status" role="status">${session.draft ? '核对文字后，就可以发送。' : Recognition ? '说完核对文字，再发送。' : cloudOrigin ? '录音后可回听、转写，或直接输入英文。' : '录音后可回听，再填写你的英文回答。'}</p>
    </div>`;
  }

  function partnerBubble(text, index, translation = '', newest = false, part = 'all') {
    return `<div class="message message-partner ${newest ? 'message-enter' : ''}">${portrait()}<div class="message-body"><span class="speaker">${partner}</span>
      <div class="bubble"><p lang="en">${escape(text)}</p>
      ${translation ? '<details class="bubble-translation"><summary>看中文</summary><p>' + escape(translation) + '</p></details>' : ''}</div>
      <button class="play-message" type="button" data-action="hear-turn" data-round="${index}" data-part="${part}" aria-label="听 Alex 的这句话">▷ 再听一次</button>
    </div></div>`;
  }

  function renderDialogue() {
    const complete = session.index === listLength();
    const replies = session.results.map((item, index) => `
      <div class="message message-self ${replying && index === session.results.length - 1 ? 'message-enter' : ''}"><div class="message-body"><span class="speaker">我</span>
        <p class="bubble" lang="en">${escape(item.answer)}</p>
        <button class="play-message" type="button" data-action="review" data-round="${index}"><span class="inline-score">${item.score} 分</span> 看建议</button>
      </div><span class="self-avatar" aria-hidden="true">我</span></div>
      ${replying && index === session.results.length - 1
        ? `<div class="message message-partner typing-message">${portrait()}<div class="typing-dots" role="status" aria-label="Alex 正在回应"><i></i><i></i><i></i></div></div>`
        : partnerBubble(item.reply, index, '', index === session.results.length - 1, 'reply') +
          (item.nextPrompt ? partnerBubble(item.nextPrompt, index, scene.rounds[index + 1].promptZh, index === session.results.length - 1, 'next') : '')}`).join('');
    const progress = Array.from({ length: scene.rounds.length }, (_, index) => `<i class="${index < session.index ? 'done' : ''}"></i>`).join('');
    return `<article class="studio conversation">
      <header class="studio-header"><div class="partner-avatar">${portrait()}<span class="avatar-status" aria-hidden="true"></span></div><div><h3>${partner} <span>英语练习搭档</span></h3><p id="partner-status" role="status">轮到你来回答</p></div><div class="studio-progress"><span>${complete ? '3 / 3 轮' : '第 ' + (session.index + 1) + ' / 3 轮'}</span><span class="round-dots" aria-hidden="true">${progress}</span></div></header>
      <div class="chat-thread" id="chat-thread" aria-label="和 Alex 的对话" tabindex="0">
        <p class="chat-scene-note">${escape(scene.english)} · ${escape(scene.situation)}</p>
        ${partnerBubble(scene.rounds[0].prompt, -1, scene.rounds[0].promptZh)}${replies}
      </div>
      ${replying ? '<div class="reply-wait">Alex 正在接话，马上回来…</div>' : complete ? `<div class="session-finished"><span class="finish-check" aria-hidden="true">✓</span><div><b>你完成了这次对话</b><p>本次平均参考分 <strong>${Math.round(session.results.reduce((sum, item) => sum + item.score, 0) / session.results.length)}</strong> / 100</p></div><div class="controls">${action('再聊一次', 'restart', true)}${action('看本次反馈', 'feedback')}</div></div>` : renderComposer()}
    </article>`;
  }

  function renderReading() {
    const complete = session.index === listLength();
    const line = scene.lines[session.index];
    const steps = Array.from({ length: listLength() }, (_, i) =>
      '<span class="' + (i === session.index ? 'active' : i < session.index ? 'done' : '') + '">' + (i + 1) + '</span>'
    ).join('');
    return `<article class="studio reading">
      <header class="studio-header"><span class="reading-icon" aria-hidden="true">♫</span><div><h3>我的跟读练习</h3><p>听一句 · 跟一句 · 回听</p></div><span class="studio-tag">${complete ? '已完成' : '第 ' + (session.index + 1) + ' / 4 句'}</span></header>
      ${complete ? `<div class="session-finished"><h3>四句跟读完成</h3><div class="controls">${action('和 Alex 对话', 'switch', true)}${action('看本次反馈', 'feedback')}${action('再练一次', 'restart')}</div></div>`
        : `<div class="reading-line"><div class="turn-steps" aria-label="跟读进度">${steps}</div>
          <p class="turn-index">SPEAKER ${line[0]}</p><h3 class="prompt" lang="en">${escape(line[1])}</h3>
          <p class="small">${escape(line[2])}</p><div class="controls">${action('▷ 听本句', 'prompt')}</div></div>${renderComposer()}
          ${session.results[session.index] ? `<button class="reading-result" type="button" data-action="review" data-round="${session.index}">本句匹配度 <b>${session.results[session.index].score} / 100</b><span>查看词语反馈 →</span></button>` : ''}`}
    </article>`;
  }

  function renderPractice() {
    if (session.index === listLength() && !session.archiveHandled) {
      session.archiveHandled = true;
      window.Unit3Archive?.complete(scene.id, mode, session.results);
    }
    practice.hidden = false;
    practice.innerHTML = `<div class="practice-top">
      <div>${action('← 换个情境', 'scenes')}<h2 tabindex="-1">${escape(scene.title)}</h2></div>
      <div class="practice-tabs"><button type="button" data-action="read" aria-pressed="${mode === 'read'}">自己跟读</button><button type="button" data-action="talk" aria-pressed="${mode === 'talk'}">和搭档聊</button></div>
      </div><div class="practice-layout">
        ${mode === 'talk' ? renderDialogue() : renderReading()}
        <div class="practice-side"><details class="score-sheet" id="score-sheet"><summary>本次评分 <span>${session.results.length ? session.results.length + ' ' + (mode === 'read' ? '句' : '轮') + '已完成' : '作答后查看'}</span></summary><aside class="score-panel" id="score-panel" tabindex="-1" aria-label="练习评分">${scoreContent()}</aside><p class="score-footnote">参考分按回答文字和任务要点计算，可在每轮反馈中查看来源。</p></details>${renderAside()}</div>
      </div>`;
    const field = document.getElementById('answer');
    field?.addEventListener('input', () => {
      session.draft = field.value;
      session.source = 'typed';
      renderCaptureButtons();
    });
    renderRecording();
    renderCaptureButtons();
    syncPartnerState();
    const thread = document.getElementById('chat-thread');
    if (thread) thread.scrollTop = thread.scrollHeight;
  }

  function announce(text, error = false) {
    const element = document.getElementById('voice-status');
    if (element) {
      element.textContent = text;
      element.classList.toggle('error', error);
    }
  }

  function updateDraft(value, source) {
    session.draft = value.slice(0, 500);
    session.source = source;
    const field = document.getElementById('answer');
    if (field) field.value = session.draft;
    renderCaptureButtons();
  }

  function renderRecording() {
    const panel = document.getElementById('recording-panel');
    if (!panel) return;
    panel.hidden = !recordingUrl;
    panel.innerHTML = recordingUrl
      ? '<audio controls aria-label="回听本次录音" src="' + escape(recordingUrl) + '"></audio>' +
        (cloudOrigin ? action(cloudRequest ? '正在转写…' : '用腾讯云转写这段录音', 'cloud', false, !!cloudRequest) : '') : '';
  }

  function renderCaptureButtons() {
    const voice = practice.querySelector('[data-action="speak"]');
    const local = practice.querySelector('[data-action="record"]');
    if (!voice) return;
    (voice.querySelector('.mic-label') || voice).textContent = capture?.kind === 'live'
      ? (capture.stopping ? '正在收尾…' : capture.active ? '说完了' : '取消连接') : capture?.kind === 'speech' ? '说完了'
      : capture?.kind === 'record' && !Recognition ? '停止录音'
        : '开始说话';
    voice.classList.toggle('capturing', capture?.kind === 'live' || capture?.kind === 'speech' || (capture?.kind === 'record' && !Recognition));
    voice.disabled = !!cloudRequest || !!capture?.stopping || (capture?.kind === 'record' && !!Recognition);
    if (local) {
      local.textContent = capture?.kind === 'record' ? '停止录音' : '开始录音';
      local.disabled = !!cloudRequest || capture?.kind === 'speech' || capture?.kind === 'live';
    }
    practice.querySelector('[data-action="grade"]').disabled = !!capture || !!cloudRequest || !session.draft.trim();
    practice.querySelector('[data-action="example"]').disabled = !!capture || !!cloudRequest;
    syncPartnerState();
  }

  function startRecognition() {
    if (capture?.kind === 'live') {
      if (!capture.active) { capture.live.cancel(); capture = null; renderCaptureButtons(); announce('已取消连接，可以重新开始。'); }
      else capture.live.stop();
      return;
    }
    if (cloudOrigin && window.Unit3Realtime) { startRealtimeRecognition(); return; }
    if (capture?.kind === 'speech') {
      capture.recognizer.stop();
      return;
    }
    if (!Recognition) {
      void startRecording();
      return;
    }
    if (capture || cloudRequest) return;
    stopVoice();
    captureError = '';
    let recognizer;
    try {
      recognizer = new Recognition();
    } catch {
      announce('浏览器暂时无法开始识别。可以本地录音，或填写英文。', true);
      return;
    }
    recognizer.lang = 'en-US';
    recognizer.interimResults = true;
    recognizer.continuous = true;
    const job = { kind: 'speech', recognizer, heard: false, timer: null };
    capture = job;
    renderCaptureButtons();
    recognizer.onstart = () => {
      if (capture !== job) return;
      job.active = true;
      syncPartnerState();
    };
    recognizer.onresult = event => {
      if (capture !== job) return;
      const value = Array.from(event.results).map(result => result[0].transcript).join(' ').trim();
      if (value) {
        job.heard = true;
        updateDraft(value, 'speech');
      }
    };
    recognizer.onerror = event => {
      if (capture !== job) return;
      captureError = event.error === 'not-allowed' ? '请允许麦克风权限，或手动填写英文。'
        : '浏览器暂时没识别成功。可以本地录音后转写，或手动填写英文。';
      announce(captureError, true);
      clearTimeout(job.timer); capture = null;
      try { recognizer.abort(); } catch { /* Already stopped. */ }
      renderCaptureButtons();
    };
    recognizer.onend = () => {
      if (capture !== job) return;
      clearTimeout(job.timer);
      capture = null;
      renderCaptureButtons();
      if (!captureError) announce(job.heard ? '检查识别文字，然后提交。' : '没有收到英文识别结果，可以重试。');
    };
    try {
      recognizer.start();
      job.timer = setTimeout(() => { if (capture === job) recognizer.stop(); }, 25000);
      announce('正在听，请说英文。');
    } catch {
      capture = null;
      renderCaptureButtons();
      announce('暂时无法开始识别，可以本地录音或填写英文。', true);
    }
  }

  function startRealtimeRecognition() {
    if(capture || cloudRequest || replying)return;
    stopVoice();disposeRecording();renderRecording();
    const job={kind:'live',active:false,stopping:false,live:null};capture=job;renderCaptureButtons();
    const keepRecording=blob=>{if(blob){disposeRecording();recording=blob;recordingUrl=URL.createObjectURL(blob);renderRecording();}};
    job.live=window.Unit3Realtime.start({
      ticket:()=>window.Unit3Archive.speechTicket(scene.id),
      onState(state){if(capture!==job)return;job.active=state==='listening';job.stopping=state==='finishing';renderCaptureButtons();
        announce(state==='listening'?'正在实时识别，说话时文字会持续出现。说完点“说完了”。':state==='finishing'?'正在接收最后的识别文字…':'正在连接实时识别；首次使用请允许麦克风。');},
      onText(text){if(capture===job)updateDraft(text,'cloud');},
      onFinish(text,blob){if(capture!==job)return;capture=null;if(text)updateDraft(text,'cloud');keepRecording(blob);renderCaptureButtons();announce(text?'识别完成。请核对文字，然后提交。':'没有听到清楚的英文，请检查麦克风后再试。',!text);},
      onError(error,text,blob){if(capture!==job)return;capture=null;if(text)updateDraft(text,'cloud');keepRecording(blob);renderCaptureButtons();announce(error.message,true);},
    });
  }

  async function startRecording() {
    if (capture?.kind === 'record') {
      if (capture.recorder?.state === 'recording') capture.recorder.stop();
      return;
    }
    if (capture || cloudRequest) return;
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
      announce('浏览器未提供录音权限。可从本地预览地址打开，或手动填写英文。', true);
      return;
    }
    stopVoice();
    const job = { kind: 'record', timer: null, stream: null, recorder: null };
    capture = job;
    renderCaptureButtons();
    announce('请允许麦克风权限。');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (capture !== job) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }
      job.stream = stream;
      const recorder = new MediaRecorder(stream);
      job.recorder = recorder;
      const chunks = [];
      recorder.ondataavailable = event => { if (event.data.size) chunks.push(event.data); };
      recorder.onstop = () => {
        clearTimeout(job.timer);
        stream.getTracks().forEach(track => track.stop());
        if (capture !== job) return;
        capture = null;
        renderCaptureButtons();
        disposeRecording();
        if (!chunks.length) {
          announce('本次没有收到录音，可以再试一次。', true);
          return;
        }
        recording = new Blob(chunks, { type: recorder.mimeType || chunks[0].type });
        recordingUrl = URL.createObjectURL(recording);
        renderRecording();
        announce(cloudOrigin ? '录音已保存在本页。回听后可点腾讯云转写，或填写英文。' : '录音已保存在本页。回听后可填写英文。');
      };
      recorder.start();
      job.active = true;
      syncPartnerState();
      job.timer = setTimeout(() => { if (recorder.state === 'recording') recorder.stop(); }, 25000);
      announce('正在录音。说完点停止，最长 25 秒。');
    } catch {
      if (capture !== job) return;
      job.stream?.getTracks().forEach(track => track.stop());
      capture = null;
      renderCaptureButtons();
      announce('麦克风暂不可用，可以手动填写英文。', true);
    }
  }

  async function toWav16k(blob) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const OfflineContext = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AudioContext || !OfflineContext) throw new Error('这个浏览器暂时无法转换录音格式。');
    const audioContext = new AudioContext();
    let original;
    try {
      original = await audioContext.decodeAudioData(await blob.arrayBuffer());
    } finally {
      await audioContext.close();
    }
    const sampleRate = 16000;
    const count = Math.ceil(original.duration * sampleRate);
    if (!count || count > sampleRate * 30) throw new Error('请录制一段不超过 25 秒的英文。');
    const offline = new OfflineContext(1, count, sampleRate);
    const source = offline.createBufferSource();
    source.buffer = original;
    source.connect(offline.destination);
    source.start();
    const samples = (await offline.startRendering()).getChannelData(0);
    const wav = new ArrayBuffer(44 + count * 2);
    const view = new DataView(wav);
    function word(offset, text) {
      for (let i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
    }
    word(0, 'RIFF');
    view.setUint32(4, 36 + count * 2, true);
    word(8, 'WAVE');
    word(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    word(36, 'data');
    view.setUint32(40, count * 2, true);
    samples.forEach((sample, index) => {
      const clamped = Math.max(-1, Math.min(1, sample));
      view.setInt16(44 + 2 * index, clamped * (clamped < 0 ? 32768 : 32767), true);
    });
    return new Blob([wav], { type: 'audio/wav' });
  }

  async function recognizeRecording() {
    if (!recording || !cloudOrigin || cloudRequest || capture) return;
    const current = epoch;
    const draftBefore = session.draft;
    const controller = new AbortController();
    cloudRequest = controller;
    const timer = setTimeout(() => controller.abort(), 35000);
    renderRecording();
    renderCaptureButtons();
    announce('正在把本段录音交给腾讯云转写。');
    try {
      const wav = await toWav16k(recording);
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = () => reject(new Error('暂时无法读取录音。'));
        reader.readAsDataURL(wav);
      });
      const uploadId = crypto.randomUUID();
      const totalChunks = Math.ceil(base64.length / 60000);
      let payload;
      for (let chunkIndex = 0; chunkIndex < totalChunks; chunkIndex++) {
        const response = await fetch(cloudApi, {
          method: 'POST', headers: { 'content-type': 'application/json' }, signal: controller.signal,
          body: JSON.stringify({
            action: 'recognizeChunk', uploadId, sceneId: 'club', round: Math.min(session.index + 1, 3),
            type: 'audio/wav', chunkIndex, totalChunks, data: base64.slice(chunkIndex * 60000, (chunkIndex + 1) * 60000),
          }),
        });
        payload = await response.json();
        if (!response.ok || !payload.ok) throw new Error(payload.error || '腾讯云转写暂时不可用。');
      }
      if (current !== epoch) return;
      if (!payload?.transcript?.trim()) throw new Error('没有收到英文识别结果。');
      if (session.draft === draftBefore) updateDraft(payload.transcript.trim(), 'cloud');
      announce(session.draft === draftBefore || session.source === 'cloud'
        ? '转写完成。检查文字后提交。' : '转写已完成，保留了你刚才填写的文字。');
    } catch (error) {
      if (current === epoch) announce((error.name === 'AbortError' ? '转写超时。' : error.message) + ' 可以回听录音，再手动填写英文。', true);
    } finally {
      clearTimeout(timer);
      if (cloudRequest === controller) {
        cloudRequest = null;
        renderRecording();
        renderCaptureButtons();
      }
    }
  }

  function grade() {
    if (capture || cloudRequest || replying || session.index >= listLength()) return;
    try {
      const index = session.index;
      const result = mode === 'read' ? gradeReading(scene.lines[index][1], session.draft)
        : gradeDialogue(scene.rounds[index], session.draft, scene.rounds[index + 1]?.prompt);
      const sources = { typed: '手动文字练习', speech: '按浏览器识别文字计分', cloud: '按腾讯云转写文字计分', example: '示例体验 · 按示例文字给出参考反馈' };
      session.results[index] = { ...result, answer: session.draft, source: session.source, sourceLabel: sources[session.source] };
      session.reviewIndex = index;
      if (mode === 'talk') {
        resetAudio();
        session.index++;
        session.draft = '';
        session.source = 'typed';
        replying = true;
        const current = epoch;
        renderPractice();
        replyTimer = setTimeout(() => {
          if (current !== epoch) return;
          replyTimer = null;
          replying = false;
          renderPractice();
          speak([result.reply, result.nextPrompt].filter(Boolean).join(' '));
        }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 100 : 750);
        return;
      }
      renderPractice();
      speak([result.reply, result.nextPrompt].filter(Boolean).join(' '));
    } catch (error) {
      announce(error.message, true);
      document.getElementById('answer')?.focus();
    }
  }

  function next() {
    const result = session.results[session.index];
    if (capture || !result) return;
    if (result.answer !== session.draft) {
      announce('你已修改回答，提交后再继续。');
      return;
    }
    resetAudio();
    session.index++;
    session.draft = '';
    session.source = 'typed';
    renderPractice();
    scrollPractice();
  }

  function review(index) {
    if (!session.results[index]) return;
    session.reviewIndex = index;
    const panel = document.getElementById('score-panel');
    document.getElementById('score-sheet').open = true;
    panel.innerHTML = scoreContent(true);
    panel.scrollIntoView({ block: 'nearest' });
    panel.focus({ preventScroll: true });
  }

  function showFeedback() {
    const sheet = document.getElementById('score-sheet');
    sheet.open = true;
    sheet.scrollIntoView({ block: 'nearest' });
    sheet.querySelector('summary').focus({ preventScroll: true });
  }

  sceneGrid.addEventListener('click', event => {
    const button = event.target.closest('[data-scene]');
    if (!button) return;
    scene = scenes.find(item => item.id === button.dataset.scene);
    renderScenes();
    if (mode) openRoute(mode);
    else document.getElementById('routes').scrollIntoView({ block: 'start' });
  });

  document.getElementById('routes').addEventListener('click', event => {
    const button = event.target.closest('[data-route]');
    if (button) openRoute(button.dataset.route);
  });

  document.getElementById('brand-home').addEventListener('click', event => {
    if (!mode) return;
    event.preventDefault();
    showHome();
  });

  practice.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    switch (button.dataset.action) {
      case 'prompt':
        speak(scene.lines[session.index][1]);
        break;
      case 'example':
        updateDraft(mode === 'read' ? scene.lines[session.index][1] : scene.rounds[session.index].example, 'example');
        announce('已填入示例，点提交可以体验评分和回应。');
        break;
      case 'reply': speak(session.results[session.reviewIndex].reply); break;
      case 'hear-turn': {
        const index = Number(button.dataset.round);
        const result = session.results[index];
        const text = index < 0 ? scene.rounds[0].prompt
          : button.dataset.part === 'reply' ? result.reply
            : button.dataset.part === 'next' ? result.nextPrompt : [result.reply, result.nextPrompt].filter(Boolean).join(' ');
        speak(text);
        break;
      }
      case 'review': review(Number(button.dataset.round)); break;
      case 'feedback': showFeedback(); break;
      case 'speak': startRecognition(); break;
      case 'record': void startRecording(); break;
      case 'cloud': void recognizeRecording(); break;
      case 'grade': grade(); break;
      case 'next': next(); break;
      case 'switch': openRoute(mode === 'read' ? 'talk' : 'read'); break;
      case 'read':
      case 'talk':
        if (button.dataset.action !== mode) openRoute(button.dataset.action);
        break;
      case 'restart':
        sessions.delete(scene.id + '/' + mode);
        openRoute(mode);
        break;
      case 'scenes': showHome(); break;
    }
  });

  window.addEventListener('pagehide', resetAudio);
  window.addEventListener('unit3-identity-changed', () => {
    resetAudio(); sessions.clear(); mode = null; session = null;
    practice.hidden = true; practice.replaceChildren(); home.hidden = false; renderScenes();
  });
  renderScenes();
}());

</script>
